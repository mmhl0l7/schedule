<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROIROM スケジュールアプリ</title>
  <style>
    :root {
      --primary-color: #0077c2;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #666666;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* 予定登録フォームエリア */
    .form-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .form-card input, .form-card select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
    }
    .btn-primary {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }

    /* メディア出演スケジュールカード（トリガー用） */
    .schedule-trigger-card {
      background: var(--card-bg);
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 12px;
      transition: transform 0.1s;
    }

    .schedule-trigger-card:active {
      transform: scale(0.98);
    }

    .date-label {
      font-weight: bold;
      color: #d84315;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .hint-text {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* モーダル（ボトムシート）オーバーレイ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* モーダル本体 */
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* モーダルヘッダー */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 8px;
    }

    /* 詳細番組カード */
    .media-detail-card {
      border: 2px solid #b3e5fc;
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      margin-bottom: 20px;
    }

    .media-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .media-icon-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thumb-icon {
      width: 44px;
      height: 44px;
      background: #eee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .time-category {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .program-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }

    .action-buttons-top {
      display: flex;
      gap: 8px;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-tver {
      background: #00a0e9;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .badge-member {
      background: #e1f5fe;
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    /* アコーディオン開閉部分 */
    .accordion-toggle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px;
      border-top: 1px dashed var(--border-color);
      user-select: none;
    }

    .accordion-body {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .accordion-body.open {
      display: block;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .sub-section {
      margin-bottom: 16px;
    }

    .btn-fod {
      background: #1a1a1a;
      color: #ff3b30;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    .sns-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sns-chip {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
    }

    .hashtag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .hashtag-chip {
      background: #e0f2f1;
      color: #00695c;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .hashtag-chip.selected {
      background: #00897b;
      color: #fff;
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .share-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-share-x, .btn-share-threads {
      background: #000;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .btn-share-threads { background: #111; }
  </style>
</head>
<body>

<div class="container">
  <h1>ROIROM メディア出演スケジュール</h1>

  <!-- 予定の簡易登録フォーム -->
  <div class="form-card">
    <h3 style="font-size: 0.95rem; margin-top:0;">予定を追加する</h3>
    <input type="text" id="inputDate" placeholder="日付 (例: 2026年9月18日(金))" value="2026年9月17日(木)">
    <input type="text" id="inputTitle" placeholder="番組名 (例: ラストノート #10)" value="ラストノート #10 (再)">
    <input type="text" id="inputTime" placeholder="時間・ジャンル (例: 02:55 テレビ)" value="02:55 テレビ">
    <button class="btn-primary" onclick="addNewSchedule()">予定を登録する</button>
  </div>

  <!-- スケジュール一覧が表示されるコンテナ -->
  <div id="scheduleListContainer"></div>
</div>

<!-- モーダル（ボトムシート） -->
<div id="scheduleModal" class="modal-overlay" onclick="handleOutsideClick(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalDateTitle">日付</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body-inner" id="modalBodyContent">
      <!-- 動的に詳細が挿入されます -->
    </div>
  </div>
</div>

<script>
  // 初期データ（LocalStorageにない場合に使用）
  const defaultSchedules = [
    {
      id: 1,
      date: "2026年9月17日(木)",
      time: "02:55 テレビ",
      title: "ラストノート #10 (再)",
      member: "寺西",
      tver: true,
      fod: true
    }
  ];

  // ローカルストレージからデータを取得、なければデフォルトを使用
  function getSchedules() {
    const saved = localStorage.getItem('roirom_schedules');
    return saved ? JSON.parse(saved) : defaultSchedules;
  }

  // ローカルストレージに保存
  function saveSchedules(schedules) {
    localStorage.setItem('roirom_schedules', JSON.stringify(schedules));
    renderScheduleCards();
  }

  // 画面にスケジュールカードを描画
  function renderScheduleCards() {
    const container = document.getElementById('scheduleListContainer');
    const schedules = getSchedules();
    
    container.innerHTML = '';
    schedules.forEach(item => {
      container.innerHTML += `
        <div class="schedule-trigger-card" onclick="openModal(${item.id})">
          <div class="date-label">${item.date}</div>
          <div class="hint-text">📅 ${item.title} (${item.time}) - タップして詳細</div>
        </div>
      `;
    });
  }

  // 新規予定追加
  function addNewSchedule() {
    const date = document.getElementById('inputDate').value;
    const title = document.getElementById('inputTitle').value;
    const time = document.getElementById('inputTime').value;

    if (!date || !title) {
      alert("日付と番組名を入力してください");
      return;
    }

    const schedules = getSchedules();
    const newId = schedules.length > 0 ? Math.max(...schedules.map(s => s.id)) + 1 : 1;
    
    schedules.push({
      id: newId,
      date: date,
      time: time,
      title: title,
      member: "寺西拓人",
      tver: true,
      fod: true
    });

    saveSchedules(schedules);
    alert("予定を登録しました！更新しても消えません。");
  }

  // モーダルを開いて詳細を表示
  function openModal(id) {
    const schedules = getSchedules();
    const item = schedules.find(s => s.id === id);
    if (!item) return;

    document.getElementById('modalDateTitle').textContent = item.date;
    
    document.getElementById('modalBodyContent').innerHTML = `
      <div class="media-detail-card">
        <div class="media-info-row">
          <div class="media-icon-title">
            <div class="thumb-icon">📺</div>
            <div>
              <div class="time-category">${item.time}</div>
              <h3 class="program-title">${item.title}</h3>
            </div>
          </div>
        </div>

        <div>
          <span class="badge-member">${item.member}</span>
        </div>

        <div class="action-buttons-top" style="margin-bottom: 12px;">
          <button class="btn-outline"><span>🔗</span> シェア</button>
          <button class="btn-outline"><span>⚪</span> 番組予約</button>
          ${item.tver ? '<button class="btn-tver">TVer</button>' : ''}
        </div>

        <div class="accordion-toggle" id="accordionToggleBtn" onclick="toggleAccordion()">
          ▼ タップで詳細
        </div>

        <div class="accordion-body" id="accordionBody">
          ${item.fod ? `
          <div class="sub-section">
            <div class="section-title">サブスクで見る</div>
            <button class="btn-fod" onclick="window.open('#', '_blank')">FOD ↗</button>
          </div>` : ''}

          <div class="sub-section">
            <div class="section-title">公式SNS</div>
            <div class="sns-chips">
              <a href="#" class="sns-chip" target="_blank">フジテレビYouTube ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式サイト ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式X ↗</a>
            </div>
          </div>

          <div class="sub-section">
            <div class="section-title">ハッシュタグ</div>
            <div class="helper-text">シェアしたいハッシュタグを選んでください（複数選択可）</div>
            <div class="hashtag-chips">
              <button class="hashtag-chip selected" onclick="toggleHashtag(this)">#ラストノート</button>
              <button class="hashtag-chip selected" onclick="toggleHashtag(this)">#寺西拓人</button>
            </div>
          </div>

          <div class="share-buttons">
            <button class="btn-share-x" onclick="shareToSNS('${item.title}')">𝕏 Xにシェア</button>
            <button class="btn-share-threads" onclick="shareToSNS('${item.title}')">Threadsにシェア</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('scheduleModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('scheduleModal').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  function handleOutsideClick(event) {
    if (event.target.id === 'scheduleModal') {
      closeModal();
    }
  }

  function toggleAccordion() {
    const body = document.getElementById('accordionBody');
    const btn = document.getElementById('accordionToggleBtn');
    body.classList.toggle('open');
    btn.textContent = body.classList.contains('open') ? '▲ タップで閉じる' : '▼ タップで詳細';
  }

  function toggleHashtag(element) {
    element.classList.toggle('selected');
  }

  function shareToSNS(title) {
    const selectedTags = Array.from(document.querySelectorAll('.hashtag-chip.selected'))
                              .map(tag => tag.textContent)
                              .join(' ');
    const text = `${title} 放送！ ${selectedTags}`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
  }

  // 初回ロード時にリストを描画
  window.onload = function() {
    renderScheduleCards();
  };
</script>

</body>
</html>
