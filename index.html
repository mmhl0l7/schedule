<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROIROM スケジュールアプリ</title>
  <style>
    :root {
      --primary-color: #0077c2;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #666666;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    /* メディア出演スケジュールカード（トリガー用） */
    .schedule-trigger-card {
      background: var(--card-bg);
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.1s;
    }

    .schedule-trigger-card:active {
      transform: scale(0.98);
    }

    .date-label {
      font-weight: bold;
      color: #d84315;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .hint-text {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* モーダル（ボトムシート）オーバーレイ */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    /* モーダル本体 */
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* モーダルヘッダー */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-sub);
      padding: 0 8px;
    }

    /* 詳細番組カード */
    .media-detail-card {
      border: 2px solid #b3e5fc;
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      margin-bottom: 20px;
    }

    .media-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .media-icon-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .thumb-icon {
      width: 44px;
      height: 44px;
      background: #eee;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .time-category {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .program-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0;
    }

    .action-buttons-top {
      display: flex;
      gap: 8px;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-tver {
      background: #00a0e9;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .badge-member {
      background: #e1f5fe;
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      display: inline-block;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    /* アコーディオン開閉部分 */
    .accordion-toggle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px;
      border-top: 1px dashed var(--border-color);
      user-select: none;
    }

    .accordion-body {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .accordion-body.open {
      display: block;
    }

    /* セクションブロック */
    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .sub-section {
      margin-bottom: 16px;
    }

    /* サブスクボタン */
    .btn-fod {
      background: #1a1a1a;
      color: #ff3b30;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }

    /* SNSリンクチップ */
    .sns-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sns-chip {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ハッシュタグチップ */
    .hashtag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .hashtag-chip {
      background: #e0f2f1;
      color: #00695c;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .hashtag-chip.selected {
      background: #00897b;
      color: #fff;
    }

    .helper-text {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    /* シェアボタン群 */
    .share-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-share-x {
      background: #000;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-share-threads {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ROIROM メディア出演スケジュール</h1>

  <!-- カレンダーの予定日を模したカード -->
  <div class="schedule-trigger-card" onclick="openModal()">
    <div class="date-label">2026年9月17日(木)</div>
    <div class="hint-text">📅 タップして詳細を見る</div>
  </div>
</div>

<!-- モーダル（ボトムシート） -->
<div id="scheduleModal" class="modal-overlay" onclick="handleOutsideClick(event)">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2 id="modalDateTitle">2026年9月17日(木)</h2>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>

    <div class="modal-body-inner">
      <!-- メディア詳細カード -->
      <div class="media-detail-card">
        <div class="media-info-row">
          <div class="media-icon-title">
            <div class="thumb-icon">📺</div>
            <div>
              <div class="time-category">02:55 テレビ</div>
              <h3 class="program-title">ラストノート #10 (再)</h3>
            </div>
          </div>
        </div>

        <!-- メンバーバッジ -->
        <div>
          <span class="badge-member">寺西</span>
        </div>

        <div class="action-buttons-top" style="margin-bottom: 12px;">
          <button class="btn-outline"><span>🔗</span> シェア</button>
          <button class="btn-outline"><span>⚪</span> 番組予約</button>
          <button class="btn-tver">TVer</button>
        </div>

        <!-- アコーディオン開閉部分 -->
        <div class="accordion-toggle" id="accordionToggleBtn" onclick="toggleAccordion()">
          ▼ タップで詳細
        </div>

        <!-- 開閉の中身 -->
        <div class="accordion-body" id="accordionBody">
          
          <!-- サブスクで見る -->
          <div class="sub-section">
            <div class="section-title">サブスクで見る</div>
            <button class="btn-fod" onclick="window.open('#', '_blank')">
              FOD ↗
            </button>
          </div>

          <!-- 公式SNS -->
          <div class="sub-section">
            <div class="section-title">公式SNS</div>
            <div class="sns-chips">
              <a href="#" class="sns-chip" target="_blank">フジテレビYouTube ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式サイト ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式X ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式TikTok ↗</a>
              <a href="#" class="sns-chip" target="_blank">公式Instagram ↗</a>
            </div>
          </div>

          <!-- ハッシュタグ -->
          <div class="sub-section">
            <div class="section-title">ハッシュタグ</div>
            <div class="helper-text">シェアしたいハッシュタグを選んでください（複数選択可）</div>
            <div class="hashtag-chips">
              <button class="hashtag-chip selected" onclick="toggleHashtag(this)">#ラストノート</button>
              <button class="hashtag-chip selected" onclick="toggleHashtag(this)">#寺西拓人</button>
            </div>
          </div>

          <!-- シェアボタン -->
          <div class="share-buttons">
            <button class="btn-share-x" onclick="shareToSNS('x')">𝕏 Xにシェア</button>
            <button class="btn-share-threads" onclick="shareToSNS('threads')">Threadsにシェア</button>
          </div>

        </div><!-- /accordion-body -->

      </div><!-- /media-detail-card -->

    </div>
  </div>
</div>

<script>
  // モーダルを開く
  function openModal() {
    document.getElementById('scheduleModal').classList.add('active');
    document.body.style.overflow = 'hidden'; // 背景スクロール固定
  }

  // モーダルを閉じる
  function closeModal() {
    document.getElementById('scheduleModal').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  // 背景クリックで閉じる
  function handleOutsideClick(event) {
    if (event.target.id === 'scheduleModal') {
      closeModal();
    }
  }

  // アコーディオンの開閉切替
  function toggleAccordion() {
    const body = document.getElementById('accordionBody');
    const btn = document.getElementById('accordionToggleBtn');
    
    body.classList.toggle('open');
    if (body.classList.contains('open')) {
      btn.textContent = '▲ タップで閉じる';
    } else {
      btn.textContent = '▼ タップで詳細';
    }
  }

  // ハッシュタグの選択・解除
  function toggleHashtag(element) {
    element.classList.toggle('selected');
  }

  // シェア機能のモック
  function shareToSNS(platform) {
    const selectedTags = Array.from(document.querySelectorAll('.hashtag-chip.selected'))
                              .map(tag => tag.textContent)
                              .join(' ');
    const text = `ラストノート #10 (再) 02:55 放送！ ${selectedTags}`;
    
    if (platform === 'x') {
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');
    } else if (platform === 'threads') {
      alert(`Threads共有用テキスト:\n${text}`);
    }
  }
</script>

</body>
</html>
